# Builds LMMS for WebAssembly: Emscripten, Qt for WebAssembly, LMMS's libraries
# cross-compiled, LMMS itself with patches/ applied, then renders a test project under
# Node. The toolchain, Qt and the libraries are cached, so later runs go straight to
# LMMS; ccache keeps LMMS's compiled objects between runs.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Qt 6.8 for WebAssembly is built with, and documents, Emscripten 3.1.56
  EMSDK_VERSION: 3.1.56
  QT_VERSION: 6.8.3
  LMMS_TAG: v1.3.0-alpha.2
  # Some of the libraries' CMake files predate CMake 3.5
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # a version tag's run publishes its release
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Host tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends ninja-build ccache liblist-moreutils-perl libxml-parser-perl
          pipx install "cmake==3.31.6"
          pipx install "aqtinstall==3.3.0"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          {
            echo "EM_CACHE=$RUNNER_TEMP/emcache"
            echo "CCACHE_DIR=$RUNNER_TEMP/ccache"
            echo "CCACHE_MAXSIZE=2G"
            echo "CCACHE_COMPILERCHECK=string:emsdk-$EMSDK_VERSION"
            echo "DEPS=$RUNNER_TEMP/deps"
            echo "QT_HOST=$RUNNER_TEMP/qt/$QT_VERSION/gcc_64"
            echo "QT_WASM=$RUNNER_TEMP/qt/$QT_VERSION/wasm_singlethread"
          } >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Emscripten ${{ env.EMSDK_VERSION }}
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}
          actions-cache-folder: emsdk-cache

      - name: Restore Emscripten's library cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/emcache
          key: emcache-${{ env.EMSDK_VERSION }}-${{ github.run_id }}
          restore-keys: emcache-${{ env.EMSDK_VERSION }}-

      - name: Versions
        run: |
          cmake --version | head -1
          ninja --version
          ccache --version | head -1
          node --version
          emcc --version | head -1

      # ---------------------------------------------------------------- Qt
      - name: Restore Qt
        id: qt
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/qt
          key: qt-${{ env.QT_VERSION }}-wasm_singlethread-linux_gcc_64-1

      - name: Install Qt ${{ env.QT_VERSION }} (host tools and WebAssembly, single-threaded)
        if: steps.qt.outputs.cache-hit != 'true'
        run: |
          aqt install-qt linux desktop "$QT_VERSION" linux_gcc_64 -O "$RUNNER_TEMP/qt" --archives qtbase qtsvg icu
          aqt install-qt all_os wasm "$QT_VERSION" wasm_singlethread -O "$RUNNER_TEMP/qt" --archives qtbase qtsvg

      - name: Save Qt
        if: steps.qt.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/qt
          key: qt-${{ env.QT_VERSION }}-wasm_singlethread-linux_gcc_64-1

      - name: Qt's features
        run: |
          ls "$QT_HOST/bin" "$QT_WASM/bin" | head -40
          ls "$QT_HOST/libexec" | head -20 || true
          for f in "$QT_WASM/include/QtCore/qtcore-config.h" "$QT_WASM/include/QtCore/qconfig.h"; do
            echo "== ${f##*/}"; grep -E "FEATURE_(thread|library|process|sharedmemory|systemsemaphore|wasm|cxx|sse|simd)" "$f" || true
          done
          grep -rh "wasm_exceptions\|wasm-exceptions\|DISABLE_EXCEPTION" "$QT_WASM/lib/cmake/Qt6" | sort -u | head -20 || true

      # ---------------------------------------------------------------- libraries
      - name: Restore libraries
        id: deps
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/deps
          key: deps-${{ env.EMSDK_VERSION }}-${{ hashFiles('scripts/build-deps.sh') }}

      - name: Build libraries (libsamplerate, libsndfile with FLAC/Ogg/Vorbis/Opus, FFTW, zlib, FluidSynth)
        if: steps.deps.outputs.cache-hit != 'true'
        run: scripts/build-deps.sh "$DEPS"

      - name: Save libraries
        if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/deps
          key: deps-${{ env.EMSDK_VERSION }}-${{ hashFiles('scripts/build-deps.sh') }}

      # ---------------------------------------------------------------- LMMS
      - name: LMMS ${{ env.LMMS_TAG }} with the web patches
        run: scripts/fetch-lmms.sh "$RUNNER_TEMP/lmms"

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-${{ env.EMSDK_VERSION }}-${{ env.QT_VERSION }}-${{ github.run_id }}
          restore-keys: ccache-${{ env.EMSDK_VERSION }}-${{ env.QT_VERSION }}-

      - name: Configure LMMS
        run: scripts/configure-lmms.sh "$RUNNER_TEMP/lmms" "$RUNNER_TEMP/build"

      - name: Build LMMS for the web
        run: |
          ccache -z
          set -o pipefail
          cmake --build "$RUNNER_TEMP/build" --target lmms_web -j "$(nproc)" -- -k 0 2>&1 | tee "$RUNNER_TEMP/build.log"
          ccache -s

      - name: Errors
        if: failure()
        run: |
          ccache -s || true
          grep -E "error:|Error |undefined symbol|FAILED:" "$RUNNER_TEMP/build.log" | sort | uniq -c | sort -rn | head -300 || true

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-${{ env.EMSDK_VERSION }}-${{ env.QT_VERSION }}-${{ github.run_id }}

      - name: Save Emscripten's library cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/emcache
          key: emcache-${{ env.EMSDK_VERSION }}-${{ github.run_id }}

      - name: Build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            ${{ runner.temp }}/build.log
            ${{ runner.temp }}/build/CMakeCache.txt
            ${{ runner.temp }}/build/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore

      # ---------------------------------------------------------------- test
      - name: Render the test project under Node
        timeout-minutes: 20
        run: |
          set -o pipefail
          ls -l "$RUNNER_TEMP/build/web/lmms.js" "$RUNNER_TEMP/build/web/lmms.wasm"
          timeout 240 node tests/render.mjs "$RUNNER_TEMP/build/web/lmms.js" tests/tripleoscillator.mmp "$RUNNER_TEMP/tripleoscillator.wav" 6.0 | tee "$RUNNER_TEMP/render.txt"
          {
            echo "### Web build"
            echo
            echo '| file | bytes |'
            echo '| --- | --- |'
            for f in lmms.js lmms.wasm; do echo "| $f | $(stat -c %s "$RUNNER_TEMP/build/web/$f") |"; done
            echo
            echo "Test render: \`$(grep '^{' "$RUNNER_TEMP/render.txt")\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Where the render spends its time (V8's profiler, when it failed)
        if: failure()
        run: |
          [ -f "$RUNNER_TEMP/build/web/lmms.wasm" ] || exit 0
          mkdir -p "$RUNNER_TEMP/prof" && cd "$RUNNER_TEMP/prof"
          timeout -s INT 90 node --prof "$GITHUB_WORKSPACE/tests/render.mjs" "$RUNNER_TEMP/build/web/lmms.js" \
            "$GITHUB_WORKSPACE/tests/tripleoscillator.mmp" "$RUNNER_TEMP/prof/out.wav" 6.0 || true
          node --prof-process isolate-*.log 2>/dev/null | head -120 || true

      # LMMS's own release is the reference, run as Musical's server runs it today: Debian bookworm, the AppImage's lmms binary
      # with its own libraries, FluidSynth and libsndfile from the system. The web build is right when the two renders null.
      # Its samples also serve the web renders (LMMS's samples aren't in the module: a page fetches the ones a song uses).
      - name: LMMS's release, for reference
        id: reference
        timeout-minutes: 15
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -o lmms.AppImage "https://github.com/LMMS/lmms/releases/download/$LMMS_TAG/lmms-1.3.0-alpha.2-linux-x86_64.AppImage"
          echo "7580e832b9a10041ef632ebf2d70d588f41c31be8c6c80d1f9a96d1c0871298b  lmms.AppImage" | sha256sum -c -
          chmod +x lmms.AppImage
          ./lmms.AppImage --appimage-extract > /dev/null
          mkdir -p lmms-home
          sed "s|@HOME@|/work/lmms-home|" "$GITHUB_WORKSPACE/tests/native-lmmsrc.xml" > lmmsrc.xml
          docker build -q -t lmms-native - <<'EOF'
          FROM debian:bookworm-slim
          RUN apt-get update -qq && apt-get install -y -qq --no-install-recommends libfluidsynth3 libsamplerate0 libsndfile1 libgl1 \
                libglib2.0-0 libfontconfig1 libfreetype6 libx11-6 libx11-xcb1 libxcb1 libxext6 libxrender1 libxkbcommon0 libasound2 \
                libdbus-1-3 libharfbuzz0b libpng16-16 > /dev/null && rm -rf /var/lib/apt/lists/*
          EOF
          cat > native-render.sh <<'EOF'
          #!/bin/sh
          # In the container: native-render.sh <project> <out.wav>
          set -eu
          cd /work
          LD_LIBRARY_PATH=/work/squashfs-root/usr/lib QT_QPA_PLATFORM=offscreen timeout 900 \
            squashfs-root/usr/bin/lmms --allowroot -c lmmsrc.xml render "$1" -o "$2" -f wav -a -s 44100 2>&1 | tail -20
          ls -l "$2"
          EOF
          # anything LMMS or one of its plugins still misses in the container (the server's image has more, ffmpeg's among them)
          docker run --rm -v "$RUNNER_TEMP:/work" lmms-native sh -c 'cd /work; for f in squashfs-root/usr/bin/lmms squashfs-root/usr/lib/lmms/*.so; do
            LD_LIBRARY_PATH=/work/squashfs-root/usr/lib:/work/squashfs-root/usr/lib/lmms ldd "$f" | grep "not found" | sed "s|^|${f##*/}: |" || true; done'

      - name: Restore the soundfont
        id: soundfont
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/MuseScore_General.sf3
          key: soundfont-5b85b6c2c61d10b2b91cddd41efcce7b25cd31c8271d511c73afafbef20b6fa3

      # MuseScore General (MIT), the soundfont Musical plays General MIDI parts with; a web render gets only the presets a song
      # uses, cut from it by tools/sf-subset.py (which copies them as they are)
      - name: The General MIDI soundfont, and the presets the test uses cut from it
        run: |
          cd "$RUNNER_TEMP"
          [ -f MuseScore_General.sf3 ] || curl -fsSL --retry 3 -o MuseScore_General.sf3 https://ftp.osuosl.org/pub/musescore/soundfont/MuseScore_General/MuseScore_General.sf3
          echo "5b85b6c2c61d10b2b91cddd41efcce7b25cd31c8271d511c73afafbef20b6fa3  MuseScore_General.sf3" | sha256sum -c -
          python3 "$GITHUB_WORKSPACE/tools/sf-subset.py" keep MuseScore_General.sf3 sf-subset.sf3 \
            $(python3 -c 'import json; print(" ".join(json.load(open("'"$GITHUB_WORKSPACE"'/tests/instruments.json"))["soundfont_presets"]))')

      - name: Save the soundfont
        if: steps.soundfont.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/MuseScore_General.sf3
          key: soundfont-5b85b6c2c61d10b2b91cddd41efcce7b25cd31c8271d511c73afafbef20b6fa3

      - name: Several renders in one module (a page keeps it loaded)
        timeout-minutes: 15
        run: |
          set -o pipefail
          sed "s|@ASSETS@|$GITHUB_WORKSPACE/tests/assets|g" tests/musical.mmp > "$RUNNER_TEMP/musical.mmp"
          timeout 600 node tests/twice.mjs "$RUNNER_TEMP/build/web/lmms.js" "$RUNNER_TEMP/musical.mmp" tests/tripleoscillator.mmp \
            tests/assets/clip1.flac tests/assets/clip2.flac | tee "$RUNNER_TEMP/twice.txt"
          echo "Several renders in one module: \`$(grep '^{' "$RUNNER_TEMP/twice.txt")\`" >> "$GITHUB_STEP_SUMMARY"

      # Musical's test project: two sample tracks through every effect Musical maps to LMMS, native and LADSPA
      - name: "Musical's test project: web"
        timeout-minutes: 20
        run: |
          set -o pipefail
          sed "s|@ASSETS@|$GITHUB_WORKSPACE/tests/assets|g" tests/musical.mmp > "$RUNNER_TEMP/musical.mmp"
          timeout 300 node tests/render.mjs "$RUNNER_TEMP/build/web/lmms.js" "$RUNNER_TEMP/musical.mmp" "$RUNNER_TEMP/musical-web.wav" 12.0 \
            tests/assets/clip1.flac tests/assets/clip2.flac | tee "$RUNNER_TEMP/render-musical.txt"
          echo "Musical's test project (web): \`$(grep '^{' "$RUNNER_TEMP/render-musical.txt")\`" >> "$GITHUB_STEP_SUMMARY"

      - name: "Musical's test project: native"
        timeout-minutes: 15
        run: |
          docker run --rm -v "$RUNNER_TEMP:/work" -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE:ro" lmms-native \
            sh /work/native-render.sh /work/musical.mmp musical-native.wav

      - name: "Musical's test project: compared"
        run: |
          set -o pipefail
          node tests/compare.mjs "$RUNNER_TEMP/musical-native.wav" "$RUNNER_TEMP/musical-web.wav" | tee "$RUNNER_TEMP/compare-musical.txt"
          {
            echo
            echo "### Musical's test project: web against native LMMS"
            echo
            echo "\`$(grep '^{' "$RUNNER_TEMP/compare-musical.txt")\`"
            echo
            grep '^|' "$RUNNER_TEMP/compare-musical.txt"
          } >> "$GITHUB_STEP_SUMMARY"

      # Every instrument Musical's projects use, one after another (tests/instruments.json says when each plays)
      - name: "Instruments: web"
        timeout-minutes: 30
        run: |
          set -o pipefail
          S="$RUNNER_TEMP/squashfs-root/usr/share/lmms/samples"
          sed -e "s|@SOUNDFONT@|/sf/MuseScore_General.sf3|g" -e "s|@SAMPLES@|/lmms/data/samples|g" tests/instruments.mmp > "$RUNNER_TEMP/instruments-web.mmp"
          files=("$RUNNER_TEMP/sf-subset.sf3=/sf/MuseScore_General.sf3")
          for f in $(python3 -c 'import json; print(" ".join(json.load(open("tests/instruments.json"))["samples"]))'); do
            files+=("$S/$f=/lmms/data/samples/$f")
          done
          seconds=$(python3 -c 'import json; print(json.load(open("tests/instruments.json"))["seconds"])')
          timeout 1500 node tests/render.mjs "$RUNNER_TEMP/build/web/lmms.js" "$RUNNER_TEMP/instruments-web.mmp" "$RUNNER_TEMP/instruments-web.wav" \
            "$seconds" "${files[@]}" | tee "$RUNNER_TEMP/render-instruments.txt"
          echo "Instruments (web): \`$(grep '^{' "$RUNNER_TEMP/render-instruments.txt")\`" >> "$GITHUB_STEP_SUMMARY"

      - name: "Instruments: native"
        if: always() && steps.reference.outcome == 'success'
        timeout-minutes: 20
        run: |
          sed -e "s|@SOUNDFONT@|/work/MuseScore_General.sf3|g" -e "s|@SAMPLES@|/work/squashfs-root/usr/share/lmms/samples|g" \
            tests/instruments.mmp > "$RUNNER_TEMP/instruments-native.mmp"
          docker run --rm -v "$RUNNER_TEMP:/work" lmms-native sh /work/native-render.sh /work/instruments-native.mmp instruments-native.wav

      - name: "Instruments: compared, one row each"
        run: |
          set -o pipefail
          node tests/compare.mjs "$RUNNER_TEMP/instruments-native.wav" "$RUNNER_TEMP/instruments-web.wav" --segments tests/instruments.json \
            | tee "$RUNNER_TEMP/compare-instruments.txt"
          {
            echo
            echo "### Every instrument Musical uses: web against native LMMS"
            echo
            echo "\`$(grep '^{' "$RUNNER_TEMP/compare-instruments.txt" | cut -c1-200)\`"
            echo
            grep '^|' "$RUNNER_TEMP/compare-instruments.txt"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the module
        uses: actions/upload-artifact@v4
        with:
          name: lmms-web
          path: |
            ${{ runner.temp }}/build/web/lmms.js
            ${{ runner.temp }}/build/web/lmms.wasm

      # A version tag (v0.1.0) publishes the module as a release: lmms.js, lmms.wasm and their checksums, as this run built and
      # tested them. A page that loads the module pins a version and checks the files against SHA256SUMS.
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/build/web"
          sha256sum lmms.js lmms.wasm > SHA256SUMS
          cat SHA256SUMS
          gh release create "$GITHUB_REF_NAME" lmms.js lmms.wasm SHA256SUMS --repo "$GITHUB_REPOSITORY" --title "lmms-web $GITHUB_REF_NAME" \
            --notes "LMMS $LMMS_TAG built for WebAssembly by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID, where its renders were checked against LMMS's own release. Source: this repository at $GITHUB_REF_NAME, with LMMS's at $LMMS_TAG (GPL-2.0-or-later, like LMMS)."

      - name: Upload the test render
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-render
          path: |
            ${{ runner.temp }}/tripleoscillator.wav
            ${{ runner.temp }}/musical-web.wav
            ${{ runner.temp }}/musical-native.wav
            ${{ runner.temp }}/instruments-web.wav
            ${{ runner.temp }}/instruments-native.wav
          if-no-files-found: ignore
